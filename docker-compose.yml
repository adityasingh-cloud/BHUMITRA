version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: bhumitra_postgres
    environment:
      POSTGRES_USER: bhumitra_user
      POSTGRES_PASSWORD: bhumitra_password
      POSTGRES_DB: bhumitra_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bhumitra_user -d bhumitra_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: bhumitra_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: bhumitra
      RABBITMQ_DEFAULT_PASS: bhumitra123
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: bhumitra_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  ml_service:
    build:
      context: ./ml_service
    container_name: bhumitra_ml_service
    ports:
      - "8000:8000"
    environment:
      PORT: 8000

  backend:
    build:
      context: ./backend
    container_name: bhumitra_backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://bhumitra_user:bhumitra_password@postgres:5432/bhumitra_db?schema=public
      JWT_SECRET: bhumitra_national_secret_key_2026_sih
      RABBITMQ_URL: amqp://bhumitra:bhumitra123@rabbitmq:5672
      ML_SERVICE_URL: http://ml_service:8000
      BHUVAN_WMS_URL: https://bhuvan-vec1.nrsc.gov.in/bhuvan/wms
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ml_service:
        condition: service_started

volumes:
  postgres_data:
  minio_data:
